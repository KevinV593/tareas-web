<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Gestor de tareas</title>
</head>

<body>
    <header>
        <h1>Gestor de Tareas</h1>
    </header>

    <main>
        <section aria-labelledby="titulo-nueva-tarea">
            <h2 id="titulo-nueva-tarea">Nueva tarea</h2>
            <form id="formulario-tarea">
                <label for="input-tarea">Descripción de la tarea</label>
                <input type="text" id="input-tarea" name="tarea" placeholder="Escribe una tarea..." required>
                <button type="submit" id="boton-agregar">Agregar</button>
            </form>
        </section>

        <section aria-labelledby="titulo-lista-tareas">
            <h2 id="titulo-lista-tareas">Mis tareas</h2>
            <p>Tareas pendientes: <span id="contador-pendientes">0</span></p>
            <ul id="lista-tareas"></ul>
        </section>
    </main>

    <footer>
        <p>Proyecto Gestor de Tareas - David</p>
    </footer>
    <script src="./js/app.js"></script>
</body>

</html>
